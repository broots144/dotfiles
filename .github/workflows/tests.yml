name: tests
# The regression suite on macOS (the scripts target macOS: scutil, plutil, stat -f, openrsync).
# Tests run under /bin/bash 3.2, what launchd gives the scripts; coverage runs under Homebrew
# bash (xtrace to a file needs bash >= 4.1) and is reported, not gated.
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install age bash just shellcheck jq
      - name: Syntax, shellcheck, plists
        run: just syntax lint plists
      - name: Tests under /bin/bash 3.2
        run: |
          mkdir -p "$RUNNER_TEMP/bash32" && ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          PATH="$RUNNER_TEMP/bash32:$PATH" script/test
      - name: Coverage
        run: script/coverage | tee -a "$GITHUB_STEP_SUMMARY"
